name = "bet365-super-boost"
main = "index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Canary quotidien -- tant que le blocage Cloudflare-vs-Cloudflare (réputation
# IP, voir README) n'est pas levé, ça ne sert à rien de vérifier plus souvent :
# le worker prévient automatiquement dès que ça débloque (voir index.js).
[triggers]
crons = ["17 6 * * *"]

[browser]
binding = "BROWSER"

[[kv_namespaces]]
binding = "SEEN_BOOSTS"
id = "356f69173f6a42c4a5ac22b2d5201d43"
