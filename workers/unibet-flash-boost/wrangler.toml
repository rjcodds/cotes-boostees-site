name = "unibet-flash-boost"
main = "index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"] # requis par @cloudflare/puppeteer (Oddsportal)

# Vérifie la page Unibet toutes les minutes (fenêtre flash courte : 8-9 min).
[triggers]
crons = ["*/1 * * * *"]

# A créer avec : wrangler kv:namespace create SEEN_BOOSTS
# puis coller l'id renvoyé ici.
[[kv_namespaces]]
binding = "SEEN_BOOSTS"
id = "868f54d1e944414cbe155759cb1a3405"

# Browser Rendering -- nécessaire uniquement pour le fallback Oddsportal
# (comparateur multi-bookmakers, cotes chargées en JS après coup d'envoi de
# la page, pas de rendu serveur possible comme pour Unibet lui-même). Même
# binding que winamax-flash-boost.
[browser]
binding = "BROWSER"

# Service binding, PAS un fetch() HTTP classique vers *.workers.dev -- voir
# winamax-flash-boost/wrangler.toml pour l'explication complète. Utilisé
# pour logger automatiquement chaque cote flash éligible dans bet-analytix.
[[services]]
binding = "BAX_WORKER"
service = "bet-analytix-sync"

# Idem -- utilisé par /telegram-webhook pour recouper les posts manuels
# (image + légende, sans event/marché/cote lisibles) avec le digest du jour
# de winamax-flash-boost via /digest-list-debug (recoupement sur l'heure de
# dispo). Voir parseManualImagePostForBax / findWinamaxDigestMatch.
[[services]]
binding = "WINAMAX_WORKER"
service = "winamax-flash-boost"
