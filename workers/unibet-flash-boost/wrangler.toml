compatibility_date = "2025-01-01"

# Vérifie la page Unibet toutes les 2 minutes.
[triggers]
crons = ["*/2 * * * *"]

# A créer avec : wrangler kv:namespace create SEEN_BOOSTS
# puis coller l'id renvoyé ici.
