name = "winamax-flash-boost"
main = "index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Compte passé sur le plan Workers Paid (5$/mois, 10h de navigateur incluses) :
# à */5 min, 288 checks/jour * ~6-10s ≈ 14-24h/mois, soit 0,36-1,26$ de
# dépassement au-delà des 10h incluses -- reste très largement dans le budget.
# La fenêtre "Grosse Cote Boostée" dure 30-35 min chez Winamax, donc ça laisse
# 6+ chances de la voir.
# Le deuxième cron (7 8 * * *, 8h07 heure locale) déclenche le digest quotidien
# (voir postDailyDigest dans index.js) au lieu d'un check normal.
[triggers]
crons = ["*/5 * * * *", "7 8 * * *"]

[browser]
binding = "BROWSER"

# A créer avec : wrangler kv:namespace create SEEN_BOOSTS
[[kv_namespaces]]
binding = "SEEN_BOOSTS"
id = "1051561f98ad443a91b22580c377d92c"

# Service binding, PAS un fetch() HTTP classique vers *.workers.dev -- un
# Worker ne peut pas appeler un autre *.workers.dev du même compte par
# fetch() normal (bloqué par Cloudflare, erreur 1042), voir content-pipeline
# pour le précédent. Utilisé pour logger automatiquement chaque cote flash
# éligible dans bet-analytix (bilan perso de l'utilisatrice).
[[services]]
binding = "BAX_WORKER"
service = "bet-analytix-sync"
