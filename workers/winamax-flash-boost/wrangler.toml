name = "winamax-flash-boost"
main = "index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Vérifie toutes les 15 minutes : à 10 min, 144 checks/jour dépassaient déjà
# le budget gratuit (10 min/jour) même sans compter d'autres tests. À 15 min,
# 96 checks/jour * ~6s reste sous les 600s/jour, avec marge. La fenêtre "Grosse
# Cote Boostée" dure 30-35 min chez Winamax donc ça laisse 2+ chances de la voir.
[triggers]
crons = ["*/15 * * * *"]

[browser]
binding = "BROWSER"

# A créer avec : wrangler kv:namespace create SEEN_BOOSTS
[[kv_namespaces]]
binding = "SEEN_BOOSTS"
id = "1051561f98ad443a91b22580c377d92c"
